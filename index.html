<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Speak a job, get a professional quote. A local open-weight model runs entirely in your browser, no account, no server." />
    <meta name="theme-color" content="#2B4BD7" />
    <meta name="color-scheme" content="light dark" />
    <title>HushQuote: quotes that stay yours</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="HushQuote: quotes that stay yours" />
    <meta property="og:description" content="Speak a job, get a professional quote. A local open-weight model runs entirely in your browser, no account, no server." />
    <meta property="og:image" content="/cover-cobalt-pearl.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HushQuote: quotes that stay yours" />
    <meta name="twitter:description" content="Speak a job, get a professional quote. Runs entirely on your device." />
    <meta name="twitter:image" content="/cover-cobalt-pearl.png" />
  </head>
  <body>
    <script>
      // Applies a manually-picked theme before paint, to avoid a flash of
      // the wrong theme. No stored value = follow the system preference,
      // which index.css's prefers-color-scheme block already handles.
      (function () {
        try {
          var theme = window.localStorage.getItem('hushquote.theme.v1')
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme
          }
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
